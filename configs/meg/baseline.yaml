timesteps: [0,201]

blur_kernel_size: 51
system_g: 3

name: "${dataset}_${exp_setting}_ubp_${brain_backbone}_${vision_backbone}"

models:
  brain:
    target: "base.eeg_backbone.${brain_backbone}"
    params:
        c_num: 271
        z_dim: ${z_dim}
        timesteps: ${timesteps}

data:
  data_dir: data/things-meg/Preprocessed_data
  selected_ch: False
  model_type: ${vision_backbone}
  train_batch_size: 1024
  val_batch_size: 200
  test_batch_size: 200
  uncertainty_aware: True
  blur_type:
    target: base.inpating_data.AttentionWeightedMultiBlur
    params:
          h: 224
          w: 224
          blur_kernel_size: ${blur_kernel_size}
          min_kernel_size: 3
          mid_kernel_ratio: 0.35
          attn_smooth_ksize: 9
          grad_gamma: 0.8
          center_prior: 0.15
          center_sigma_ratio: 0.45
          softness: 0.15

  train_avg: True
  test_avg: True
  timesteps: ${timesteps}

train:
  epoch: ${epoch}
  optimizer: AdamW
  lr: ${lr}
  
save_dir: 'exp'